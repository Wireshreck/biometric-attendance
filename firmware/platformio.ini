; Isolated firmware builds: each environment selects exactly one entry point.
[platformio]
default_envs = production

[env]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time, default
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM=0
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv

[common]
libs =
    adafruit/Adafruit Fingerprint Sensor Library @ 2.1.3
    adafruit/RTClib @ 2.1.3
    bblanchon/ArduinoJson @ 7.0.4

[env:production]
build_src_filter =
    +<main.cpp>
    +<app/*.cpp>
    +<ble/*.cpp>
    +<hardware/*.cpp>
    +<fingerprint/*.cpp>
    +<network/*.cpp>
    +<storage/*.cpp>
lib_deps = ${common.libs}

; Compatibility environment for the prior project command `pio run -e esp32dev`.
[env:esp32dev]
extends = env:production

[env:esp32_core]
build_src_filter = -<*> +<test_modes/core_test.cpp>

[env:uart1_loopback]
build_src_filter = -<*> +<test_modes/uart_loopback_test.cpp>
build_flags = ${env.build_flags} -D UART_TEST_PORT=1

[env:uart2_loopback]
build_src_filter = -<*> +<test_modes/uart_loopback_test.cpp>
build_flags = ${env.build_flags} -D UART_TEST_PORT=2

[env:r307s]
build_src_filter = -<*> +<test_modes/r307s_test.cpp> +<r307s_uart_diag.cpp>
lib_deps = adafruit/Adafruit Fingerprint Sensor Library @ 2.1.3

[env:i2c_scan]
build_src_filter = -<*> +<test_modes/i2c_scan_test.cpp>

[env:rtc]
build_src_filter = -<*> +<test_modes/rtc_test.cpp>
lib_deps = adafruit/RTClib @ 2.1.3

[env:buzzer]
build_src_filter = -<*> +<test_modes/buzzer_test.cpp>

[env:gpio_sanity]
build_src_filter = -<*> +<test_modes/gpio_sanity_test.cpp>

[env:wifi_diag]
build_src_filter = -<*> +<test_modes/wifi_test.cpp>

[env:backend_http]
build_src_filter = -<*> +<test_modes/http_test.cpp>
lib_deps = bblanchon/ArduinoJson @ 7.0.4

[env:json]
build_src_filter = -<*> +<test_modes/json_test.cpp>
lib_deps = bblanchon/ArduinoJson @ 7.0.4

[env:storage]
build_src_filter = -<*> +<test_modes/storage_test.cpp>

[env:power_reset]
build_src_filter = -<*> +<test_modes/power_reset_test.cpp>

[env:int_rtc]
build_src_filter = -<*> +<test_modes/integration_test.cpp>
build_flags = ${env.build_flags} -D INTEGRATION_CASE=1
lib_deps = ${common.libs}

[env:int_r307s]
build_src_filter = -<*> +<test_modes/integration_test.cpp> +<r307s_uart_diag.cpp>
build_flags = ${env.build_flags} -D INTEGRATION_CASE=2
lib_deps = ${common.libs}

[env:int_r307s_rtc]
build_src_filter = -<*> +<test_modes/integration_test.cpp> +<r307s_uart_diag.cpp>
build_flags = ${env.build_flags} -D INTEGRATION_CASE=3
lib_deps = ${common.libs}

[env:int_wifi]
build_src_filter = -<*> +<test_modes/integration_test.cpp>
build_flags = ${env.build_flags} -D INTEGRATION_CASE=4
lib_deps = ${common.libs}

[env:int_backend]
build_src_filter = -<*> +<test_modes/integration_test.cpp>
build_flags = ${env.build_flags} -D INTEGRATION_CASE=5
lib_deps = ${common.libs}

[env:int_full]
build_src_filter = -<*> +<test_modes/integration_test.cpp> +<r307s_uart_diag.cpp>
build_flags = ${env.build_flags} -D INTEGRATION_CASE=6
lib_deps = ${common.libs}
