; PlatformIO Project Configuration File for Biometric School Attendance System
; Pre-Development Bootstrap Configuration

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Compiler optimization and debug flags
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM=0

; Required third-party libraries for attendance platform
lib_deps = 
    adafruit/Adafruit Fingerprint Sensor Library @ 2.1.3
    adafruit/Adafruit SSD1306 @ 2.5.9
    adafruit/Adafruit GFX Library @ 1.11.9
    adafruit/RTClib @ 2.1.3
    bblanchon/ArduinoJson @ 7.0.4

; Filesystem configuration for offline event buffering
board_build.filesystem = littlefs
