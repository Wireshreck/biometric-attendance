[project]
name = "biometric-attendance-backend"
version = "1.5.0"
description = "Local-first FastAPI backend for ESP32 biometric employee attendance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.31.0",
    "pydantic==2.9.2",
    "aiosqlite==0.20.0",
    "tzdata==2026.4",
    "python-dotenv==1.0.1",
    "openpyxl==3.1.5"
]

[project.optional-dependencies]
test = [
    "httpx==0.27.2",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
